# Render Blueprint — このファイルを読み込むだけで Web サービス + PostgreSQL を再現できる
# 使い方: Render Dashboard → New → Blueprint → このリポジトリを選択
# 詳細な手順は docs/DEPLOY.md を参照
databases:
  - name: medical-record-db
    databaseName: medical_record_production
    user: medical_record
    plan: free # 無料プラン（有効期限あり。長期運用時は有料プランへ）
    region: singapore

services:
  - type: web
    name: medical-record-app
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      # DB 接続文字列は上の DB から自動注入（手入力不要）
      - key: DATABASE_URL
        fromDatabase:
          name: medical-record-db
          property: connectionString
      # config/master.key の中身をそのまま貼る（前後の空白・改行が入らないように注意）。
      # production は config/credentials.yml.enc を使い、中身は secret_key_base のみ。
      - key: RAILS_MASTER_KEY
        sync: false
      # Active Record Encryption のキー3種。
      # production 用 credentials には含まれていないため、環境変数での指定が必須。
      # 値は `bin/rails db:encryption:init` で生成する（未設定だと db:seed / 患者データ操作で失敗する）。
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      # 画像アップロード（Active Storage + Cloudflare R2）を使う場合のみ設定。
      # 未設定でもアプリは起動する（画像保存だけが無効になる）。
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
