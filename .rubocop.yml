AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'spec/spec_helper.rb'
    - 'app/javascript/**/*'

# Railsプロジェクトの特性に合わせた設定
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/environments/*'
    - 'config/routes.rb'
    - 'lib/tasks/**/*'  # Rakeタスクは複数のタスク定義を含むため

Lint/Debugger:
  Exclude:
    - 'spec/support/capybara.rb'  # save_screenshot is intentional for test debugging

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'db/migrate/*'
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/controllers/invoices_controller.rb'  # PDF関連アクションを含むため
    - 'app/controllers/patient_consents_controller.rb'  # PDF関連アクションを含むため
  AllowedMethods:
    - 'questionnaire_params'
    - 'initialize_empty_arrays'
    - 'translate_value'
    - 'format_json_field'
    - 'set_date_range'
    - 'build_patient_consent'
    - 'create'  # PatientConsentsController#create - 複数同意書の一括作成処理
    - 'toggle_role'  # Admin::UsersController#toggle_role - エッジケース処理を含む

Metrics/ClassLength:
  Max: 155
  Exclude:
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成サービスは複雑なため除外
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成サービスは複雑なため除外
    - 'app/controllers/invoices_controller.rb'  # 多機能なコントローラーのため除外
    - 'app/controllers/patient_consents_controller.rb'  # 多機能なコントローラーのため除外

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/controllers/invoices_controller.rb'  # PDF関連アクションを含むため
    - 'app/controllers/patient_consents_controller.rb'  # 複数同意書の一括作成処理のため除外
  AllowedMethods:
    - 'set_date_range'
    - 'dismiss_announcement'  # セッション管理・バリデーション・エラーハンドリングを含むため

Metrics/CyclomaticComplexity:
  Max: 8
  Exclude:
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成は複雑な処理のため除外

Metrics/PerceivedComplexity:
  Max: 9
  Exclude:
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成は複雑な処理のため除外
    - 'app/controllers/patient_consents_controller.rb'  # 複数同意書の一括作成処理のため除外

Layout/LineLength:
  Max: 120
  Exclude:
    - 'config/**/*'
    - 'db/migrate/*'
    - 'app/services/invoice_pdf_generator.rb'  # PDF生成のテーブル定義等で長い行が必要
    - 'app/services/patient_consent_pdf_generator.rb'  # PDF生成のテーブル定義等で長い行が必要

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

# OpenStruct is used intentionally to work around PostgreSQL GROUP BY limitations
# in revenue_by_facility method (MedicalRecord model)
Style/OpenStructUse:
  Enabled: false
