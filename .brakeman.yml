# Brakeman設定ファイル
# 医療データを扱う電子カルテアプリケーションのセキュリティスキャン設定

# スキャン対象
:app_path: "."
:rails: true

# 除外するチェック（false positiveが多い場合のみ追加）
:skip_checks:
  # Ruby/Rails の EOL（サポート終了）警告を一時的に除外。
  # コードの脆弱性ではなく時間経過による依存の陳腐化警告のため CI ゲートからは除く。
  # ※本 PR マージ後に Ruby/Rails を最新へアップグレードして本除外を解消する予定。
  - EOLRuby
  - EOLRails

# 除外するファイル/ディレクトリ
:skip_files:
  - node_modules/**/*
  - vendor/**/*
  - tmp/**/*
  - log/**/*

# レポート設定
:report_format: json
:output_files:
  - brakeman-report.json

# 警告の最小信頼度レベル（0: High, 1: Medium, 2: Weak）
# 医療アプリケーションなので、すべての警告を表示
:min_confidence: 2

# 詳細な出力
:print_report: true
:pager: false

# GitHub統合
:github_repo: HIROMICHIplusSHI/medical-record-app

# その他の設定
:quiet: false
:ensure_latest: false
:ensure_ignore_notes: false
