<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4E37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="64" height="64" rx="12" fill="#F5F3F0"/>
  
  <!-- 3つのドット（メインロゴと同じ） -->
  <g>
    <circle cx="20" cy="18" r="3" fill="url(#faviconGradient)" opacity="0.7"/>
    <circle cx="32" cy="15" r="3.5" fill="url(#faviconGradient)" opacity="0.8"/>
    <circle cx="44" cy="18" r="3" fill="url(#faviconGradient)" opacity="0.7"/>
  </g>
  
  <!-- Ink の文字 -->
  <text x="32" y="48" 
        font-family="'Georgia', serif" 
        font-size="28" 
        font-weight="300" 
        fill="#5D4E37" 
        text-anchor="middle"
        letter-spacing="1">
    Ink
  </text>
</svg>